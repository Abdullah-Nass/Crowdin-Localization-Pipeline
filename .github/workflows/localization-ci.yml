name: Localization CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  localization-health:
    name: Localization Health Check
    runs-on: ubuntu-latest
    needs: lint

    env:
      TOKEN: ${{ secrets.CROWDIN_TOKEN }}
      PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check translation progress
        run: python scripts/check_progress.py --threshold 80
